name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
  jellyfin-integration:
    runs-on: ubuntu-latest
    services:
      jellyfin:
        image: jellyfin/jellyfin:10.10.7
        ports:
          - 8096:8096
        volumes:
          - /tmp/vela-media:/media
    env:
      JELLYFIN_URL: http://127.0.0.1:8096
      VELA_MEDIA_DIR: /tmp/vela-media
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Make the media dir writable (the container created it as root)
        run: sudo chmod -R a+rwX /tmp/vela-media
      - name: Seed Jellyfin
        run: node --experimental-strip-types dev/jellyfin/seed.ts
      - name: Integration test
        run: pnpm exec vitest run apps/daemon/test/jellyfin.integration.test.ts
  acceptance-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Local TV fixture protocol regressions
        run: python3 -m unittest discover -s dev/tv-fixtures -p 'test_*.py'
      - name: Shield firmware staging and artifact regressions
        run: |
          python3 -m unittest discover -s firmware/shield/tests -v
          bash -n firmware/shield/build.sh
      - name: Install bats and shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends bats shellcheck
      - name: shellcheck
        run: |
          shellcheck firmware/shield/build.sh
          shellcheck -x -P scripts/acceptance -S warning scripts/acceptance/*.sh bin/vela-ctl
          shellcheck -S warning os/files/usr/libexec/vela/fetch-wifi-firmware os/files/usr/libexec/vela/setup-commit os/files/usr/libexec/vela/setup-gate os/test/*.bats
      - name: bats
        run: bats scripts/acceptance/lib.bats bin/vela-ctl.bats os/test/fetch-wifi-firmware.bats os/test/setup-commit.bats os/test/setup-gate.bats
      - name: The pinned Wi-Fi firmware download still matches its checksum
        run: |
          dir=$(mktemp -d)
          VELA_FIRMWARE_DIR="$dir" VELA_FIRMWARE_NO_RELOAD=1 os/files/usr/libexec/vela/fetch-wifi-firmware
          ls "$dir"/brcm/brcmfmac4364b2-pcie.apple,*.bin
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Android platform the Compose libraries compile against
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test app/src/test/ui/phone.test.cjs
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug lintFirmware assembleDebug assembleFirmware
      - uses: actions/upload-artifact@v4
        with:
          name: vela-tv-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vela-tv-firmware-unsigned
          path: android/app/build/outputs/apk/firmware/app-firmware-unsigned.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: android/app/build/test-results/
