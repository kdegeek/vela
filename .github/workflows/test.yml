name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
  jellyfin-integration:
    runs-on: ubuntu-latest
    services:
      jellyfin:
        image: jellyfin/jellyfin:10.10.7
        ports:
          - 8096:8096
        volumes:
          - /tmp/vela-media:/media
    env:
      JELLYFIN_URL: http://127.0.0.1:8096
      VELA_MEDIA_DIR: /tmp/vela-media
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Make the media dir writable (the container created it as root)
        run: sudo chmod -R a+rwX /tmp/vela-media
      - name: Seed Jellyfin
        run: node --experimental-strip-types dev/jellyfin/seed.ts
      - name: Integration test
        run: pnpm exec vitest run apps/daemon/test/jellyfin.integration.test.ts
  acceptance-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats and shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends bats shellcheck
      - name: shellcheck
        run: shellcheck -x -P scripts/acceptance -S warning scripts/acceptance/*.sh bin/vela-ctl
      - name: bats
        run: bats scripts/acceptance/lib.bats
