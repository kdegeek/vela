t></label><figure data-index="0" class="tv"><img src="home-focused-night.png" alt="Home · Night, remote focus"><figcaption>Native Android TV. The D-pad selected the first media card; artwork and the independent focus ring remain crisp.</figcaption></figure><figure data-index="1" class="tv" hidden><img src="home-populated-day.png" alt="Home · Day"><figcaption>Native Android TV with pearl glass and opaque counter backings. The catalog is labelled synthetic fixture data.</figcaption></figure><figure data-index="2" class="tv" hidden><img src="../field-correction-20261031/after-night.png" alt="Ask Vela · Night"><figcaption>The actual Ask activity stays over Home. No model request was submitted.</figcaption></figure><figure data-index="3" class="tv" hidden><img src="../field-correction-20261031/after-day.png" alt="Ask Vela · Day"><figcaption>The same native input and controls in the Day material.</figcaption></figure><figure data-index="4" class="tv" hidden><img src="../field-correction-20261031/profile-night.png" alt="Profile preferences · Night"><figcaption>Native editor, existing Household profile. Save and Back stay visible; no profile changes were saved.</figcaption></figure><figure data-index="5" class="tv" hidden><img src="../field-correction-20261031/profile-day.png" alt="Profile preferences · Day"><figcaption>Actual Day editor with readable language choices and the existing explicit Save flow.</figcaption></figure><figure data-index="6" class="tv" hidden><img src="details-night.png" alt="Title details · Night"><figcaption>Loaded native title sheet. The named Resume action uses fixture metadata; playback was subsequently verified with the generated local clip.</figcaption></figure><figure data-index="7" class="tv" hidden><img src="home-undo-night.png" alt="Home change · Undo receipt"><figcaption>Actual native row move. Activating Undo subsequently restored the exact previous layout JSON.</figcaption></figure><figure data-index="8" class="tv" hidden><img src="home-opaque-night.png" alt="High contrast · reduced motion"><figcaption>Actual native opaque fallback. High contrast and Reduced motion were enabled from TV Settings, then restored.</figcaption></figure><figure data-index="9" class="tv" hidden><img src="home-apps-night.png" alt="Apps-only Home"><figcaption>Actual native Home after the original settings were restored and the fixture connection removed.</figcaption></figure><figure data-index="10" class="phone" hidden><img src="phone-approval-night.png" alt="Phone approval · Night"><figcaption>Actual production phone.html in iPhone Simulator Safari, with synthetic HTTP responses. Decline cleared the exact fixture prompt.</figcaption></figure><figure data-index="11" class="phone" hidden><img src="phone-approval-day.png" alt="Phone approval · Day"><figcaption>The same actual page in Day. This fixture is separate from the Android approval broker.</figcaption></figure><figure data-index="12" class="tv" hidden><img src="home-populated-night.png" alt="Home · Night, browsing"><figcaption>Native Android TV with no current media focus. Content rows keep the available viewport.</figcaption></figure><figure data-index="13" class="tv" hidden><img src="player-night.png" alt="Native player · Night"><figcaption>Actual native player with the generated local test clip paused after observed playback. No hardware or DRM qualification is implied.</figcaption></figure><p class="note">Unmodified captures. Synthetic media and phone data; no physical Shield use. These frames show the implementation, not the earlier HTML concepts.</p></main><script>document.getElementById('scene').addEventListener('change',function(){for(const frame of document.querySelectorAll('figure'))frame.hidden=frame.dataset.index!==this.value;});</script></body></html>
