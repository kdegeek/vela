<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Vela input correction</title><style>html,body{margin:0;padding:0;background:transparent;color:var(--foreground);font-family:var(--font-sans,system-ui,sans-serif)}*{box-sizing:border-box;min-inline-size:0}main{display:grid;gap:1rem}p{margin:0;line-height:1.5}label{display:grid;gap:.4rem;font-size:.9rem}select{inline-size:100%;min-block-size:44px;padding:.65rem .8rem;border:1px solid var(--border);border-radius:var(--radius,10px);background:var(--secondary);color:var(--foreground);font:inherit}select:focus-visible{outline:2px solid var(--ring);outline-offset:3px}select:active{background:var(--accent)}figure{margin:0;display:grid;gap:.7rem}figure[hidden]{display:none}img{display:block;inline-size:100%;block-size:auto;max-inline-size:100%;border-radius:var(--radius,10px)}figcaption{font-size:.9rem;line-height:1.5;color:var(--muted-foreground,var(--foreground))}.detail-crop{position:relative;aspect-ratio:1216/670;overflow:clip;border-radius:var(--radius,10px)}.detail-crop img{position:absolute;inset-block-start:0;inset-inline-start:0;inline-size:157.894737%;max-inline-size:none;transform:translate(-18.333333%,-18.981481%);border-radius:0}</style></head><body><main><p>Input field correction · actual TV emulator captures</p><label for="view">View<select id="view"><option value="0">After · Night</option><option value="1">Before · Night</option><option value="2">After · Day</option><option value="3">Entered draft</option><option value="4">Search</option><option value="5">Profile · Night</option><option value="6">Profile · Day</option></select></label><figure data-index="0"><div class="detail-crop"><img src="after-night.png" alt="After · Night"></div><figcaption>Actual native capture, cropped to the Ask sheet: a static label and one continuous focus outline.</figcaption></figure><figure data-index="1" hidden><div class="detail-crop"><img src="before-night.png" alt="Before · Night"></div><figcaption>Reproduced old field: the floating label interrupts the fill inside the outset frame.</figcaption></figure><figure data-index="2" hidden><div class="detail-crop"><img src="after-day.png" alt="After · Day"></div><figcaption>The corrected field in the Day theme.</figcaption></figure><figure data-index="3" hidden><img src="draft-night.png" alt="Entered draft"><figcaption>Text entry works. This draft was cleared without submitting.</figcaption></figure><figure data-index="4" hidden><img src="search-night.png" alt="Search"><figcaption>The action aligns with the input container beneath its label.</figcaption></figure><figure data-index="5" hidden><img src="profile-night.png" alt="Profile · Night"><figcaption>The shared field in a management form; actions remain visible.</figcaption></figure><figure data-index="6" hidden><img src="profile-day.png" alt="Profile · Day"><figcaption>The same management form in Day; no preferences were saved.</figcaption></figure></main><script>document.getElementById('view').addEventListener('change',function(){for(const frame of document.querySelectorAll('figure'))frame.hidden=frame.dataset.index!==this.value;});</script></body></html>
