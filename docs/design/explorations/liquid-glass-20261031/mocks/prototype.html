function icon(name,cls=''){return `<svg class="${cls}" viewBox="0 0 28 29" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.sail}</svg>`}
const views=[['home-night','Home · Night'],['home-day','Home · Day'],['home-entry','Home · entry focus'],['apps','Apps-only Home'],['app-focus','Apps focus · retained title'],['ask','Ask · empty'],['ask-draft','Ask · reviewed draft'],['ask-listening','Ask · listening specimen'],['ask-unavailable','Ask · speech unavailable'],['details','Title · details / Resume'],['editor','People · preferences'],['phone','Phone · conversation & remote'],['phone-approval','Phone · approval'],['arrange','Home · arrange rows'],['undo','Home · grouped receipt'],['undo-kept','Home · acknowledged / Undo retained'],['restore','Restore · Cancel focused'],['opening','Resume · opening / unconfirmed'],['working','Agent · working'],['shell-states','Shell · stable agent states'],['approval','TV · read-only approval'],['busy','Undo · busy / unavailable'],['unknown','App handoff · outcome unknown'],['opaque-home','Opaque · Home'],['opaque-ask','Opaque · Ask'],['materials','Material · bright / busy / dark']];
const notes={
'home-night':['Matched Home pair','Same title, artwork, position and media-card focus in Night and Day. The selected Home underline is separate from focus.','OK opens details; Back returns to Home navigation; Up enters the shell; Down enters Apps. Recently added and My list continue below this viewport.'],
'home-day':['Matched Home pair','Pearl replaces the control tint; the photographs retain their color. No global bleaching layer.','Same content and focus as Night. Proposed compact title hierarchy; existing media/app effects stay exact.'],
'home-entry':['Home entry','Home is selected and receives initial focus. The browsing composition stays still when focus moves down.','Down enters the first media item; Left/Right traverses labeled destinations. The shell keeps all seven destinations and a fixed 134-unit agent slot.'],
'apps':['Sparse Home','No library, fabricated recommendations or compulsory setup card. Optional library access stays with layout controls.','Home starts focused; Down enters Live TV. OK on an app means Open. Down from the row reaches Arrange home. Undo appears only when a valid receipt exists.'],
'app-focus':['Focus continuity proposal','The last media title stays compact and identified as retained context; the Apps row gets an explicit Open action. No sliced captions.','Up returns to the last media item; Down enters Recently added, then My list. Return focus after launching an app is an acceptance target, not verified behavior.'],
'ask':['Contextual Ask proposal','Home remains recognizable. Initial focus is the labeled request field; no microphone or request starts itself.','Down reaches Speak when Ask is empty/disabled; Right reaches Back. Back closes and returns to the invoking Ask control.'],
'ask-draft':['Reviewed draft','Speech is a draft. Ask is a separate, deliberate action. Title-context attachment is not implied.','Down reaches Ask, Right reaches Speak, then Back. Explicit Ask demonstrates Working locally; closing presentation is not Stop task.'],
'ask-listening':['Listening specimen','A static illustration entered only by selecting Speak. This prototype never requests a microphone or performs recognition.','Stop listening returns to a reviewable draft; it never submits. Back closes. Reduced motion keeps identical state words.'],
'ask-unavailable':['Speech unavailable','Typing, Ask and Back remain usable. No blind retry or hidden auto-start.','The message is local to the composer; field and action positions stay stable.'],
'details':['Details / Resume','Exact invented movie and Jellyfin source. Back receives safe initial focus. Resume is clearly available without taking focus.','Down from Back reaches Resume; Right reaches Save to My list. Back restores the originating tile. Resume only illustrates Opening, never observed playback.'],
'editor':['Person-first editor proposal','Preferences lead, recovery remains discoverable. Bounded fields and a stable Back / Save region fit in one TV view.','Initial Back focus. Up enters fields; Right reaches Save. Language-name selectors are a proposed widget with a custom-tag route; existing validation must remain.'],
'phone':['Companion family · 393 CSS px','Smoked glass remote, a quiet conversation, and 44-unit or larger touch targets. No TV navigation squeezed onto a phone.','Local touch controls show demonstration feedback only. No TV input, task execution, pairing or microphone access occurs.'],
'phone-approval':['Approval · paired phone','Allow once / Decline belong here. The prompt names the exact target and effect; one decision is tied to one prompt.','Buttons demonstrate a local acknowledgement. They do not approve anything on a service or TV.'],
'arrange':['Arrange home','Reordering is a local illustration of an already-saved layout change; the receipt keeps one-step Undo.','Back receives initial focus. Move Apps up demonstrates the receipt; Restore default layout opens its ordinary Cancel-focused confirmation.'],
'undo':['One grouped receipt','Home updated is an already-saved change. Keep layout acknowledges this receipt; it is not a save action.','No automatic focus theft. Undo and Keep layout are locally functional. One step, session-only; no expiry or multistep-history claim.'],
'undo-kept':['Acknowledged receipt','The receipt is dismissed. Undo last home change remains directly beside Arrange home for the acknowledged receipt.','The recovery action does not disappear after acknowledgement. It is conditional; this specimen has a valid receipt.'],
'restore':['Ordinary confirmation','Cancel receives initial focus. The replacement rows are stated exactly.','OK on Cancel or Back closes. Restore defaults only changes the local illustration, subject to no real write.'],
'opening':['Opening is not Playing','The exact movie and Jellyfin source stay named. The UI has requested resume; it has not observed playback.','A separate unknown-effect specimen covers external app handoff. No success flourish or repeated submission is shown.'],
'shell-states':['Three stable agent states','Idle, Working and Needs your OK share exactly the same target geometry. A long person name truncates in place and remains fully labeled.','All seven destinations stay discoverable. This board compares states; it is not three simultaneous navigation bars in the product.'],
'working':['Three stable agent states','Ask Vela, Working, Needs your OK use the same reserved shell width. Idle is a small periwinkle sail; approval adds words and a caution glyph.','Working opens Activity. Stop task is a distinct explicit action and is never initially focused. No looping glow or implied success.'],
'approval':['Read-only TV notice','Exact target and effect, plus remote prompt-key instruction. No Allow / Decline controls, pointer targets or focus inside this overlay.','The notice is not a D-pad scope. Existing remote prompt-key gate or paired phone handles the decision; without TV control use “Answer on your paired phone.”'],
'busy':['Busy / unavailable Undo','The valid one-step receipt remains visible; another controller temporarily prevents Undo.','Disabled action keeps its position and reason. No timeout or promise of automatic retry.'],
'unknown':['Unknown effect','App handoff is separated from playback. Opening an external app cannot prove that a movie started.','Review Activity or check the app before trying again. No celebratory success or blind retry button.'],
'opaque-home':['Opaque / high-contrast tier','Same control geometry and identifying artwork; atmosphere and transparency are removed.','A 4-unit focus perimeter and strong solid surface boundaries survive without motion or glass.'],
'opaque-ask':['Opaque / high-contrast tier','Same field labels, hierarchy and control map as the contextual glass composer.','No blur API is required. This is a mockup, not a contrast-certification or hardware-performance claim.'],
'materials':['Material construction','Cached soft artwork, local tonal tint, upper/leading light, dense reading zones and a quiet return edge. Crisp content is separate.','This web composition does not depend on live backdrop blur. A production cached-art tier and an opaque tier are proposals; native GPU cost remains unmeasured.']};

function mediaRow(focused=false,recent=false){return `<div class="media-row">${titles.map((t,i)=>`<article class="media-item"><button class="media-card ${focused&&i===0?'remote':''}" data-view="details" aria-label="${t[1]}, details"><img src="${ART[t[0]]}" alt="${t[0]==='north'?'A warmly lit cabin beside an alpine lake':t[0]==='train'?'A neon-lit city street with tram tracks':t[0]==='kyoto'?'Two people on a sunlit street beside a Kyoto pagoda':'A dinner plate served in a warmly lit restaurant'}"><span class="art-shade"></span><span class="poster-wordmark ${t[0]}">${t[4]}</span>${!recent?`<span class="progress" style="--progress:${t[5]}%"><span></span></span>`:''}</button><h3 class="caption">${t[1]}</h3>${!recent?`<div class="subcaption"><span>${t[3]}</span>${i===0?'<span class="details-hint">OK · Details</span>':''}</div>`:''}</article>`).join('')}</div>`}
function appsRow(focused=false,big=false){const apps=[['live','Live TV',icon('tv')+'<span>TV</span>'],['store','Play Store','<span class="play-mark"></span><span>Google Play</span>'],['settings','Settings',icon('gear')],['youtube','YouTube','<span class="yt">▶</span><span>YouTube</span>']];return `<div class="app-row">${apps.map((x,i)=>`<article class="app-item"><button class="app-card ${x[0]} ${focused&&i===2?'remote':''}" data-action="open-app" data-app="${x[1]}" aria-label="Open ${x[1]}">${x[2]}</button><p class="app-caption">${x[1]}${focused&&i===2?' <span class="details-hint">OK · Open</span>':''}</p></article>`).join('')}${!big?'<span class="app-tail"><button data-view="apps">All apps →</button></span>':''}</div>`}

function sparse(receipt=false,neutral=false){return `<div class="scene"></div>${shell('Home','idle',!receipt&&!neutral)}<div class="rails"><div class="rail-heading"><h2>Apps</h2></div>${appsRow(receipt,true)}${arrange(current==='undo-kept'||kept)}${undone?'<p class="intro" style="font-size:14px;margin-block-start:15px;color:var(--muted-ink)">Previous layout restored in this demonstration.</p>':''}</div><div class="home-foot"><span class="brand-word">Vela</span><span>Home, at your pace.</span></div>${receipt?`<div class="receipt-lane glass"><span class="receipt-title">${icon('check')} Home updated</span>${current==='busy'?'<span style="font-size:12px;color:var(--muted-ink)">Another controller is busy</span>':''}<button class="btn" data-action="undo" ${current==='busy'?'disabled':''}>Undo</button><button class="btn text" data-action="keep">Keep layout</button></div>`:''}`}
function arrangeSheet(){return sparse(false,true)+`<div class="scrim"></div><section class="sheet glass dense" style="inset-block-start:103px;--gy:103px;padding-block:20px" role="dialog"><div style="display:flex;align-items:center;justify-content:space-between;margin-block-end:16px"><h1>Arrange home</h1><button class="btn text small remote" data-view="apps">${icon('back')} Back</button></div>${['Continue watching','Apps','Recently added','My list'].map((x,i)=>`<div style="display:flex;align-items:center;gap:17px;border-block-start:1px solid var(--line);padding-block:9px;font-size:16px;min-block-size:49px"><span style="font-size:12px;color:var(--muted-ink)">${i+1}</span><span>${x}</span><button class="btn text small" style="margin-inline-start:auto" data-action="move-row">${i===0?'Move down':'Move up'}</button></div>`).join('')}<button class="btn text small" style="margin-block-start:12px" data-view="restore">Restore default layout…</button></section>`}
function ask(){let listening=current==='ask-listening',draft=current==='ask-draft',unavailable=current==='ask-unavailable';return home({focus:false})+`<div class="scrim"></div><section class="sheet glass dense" role="dialog" aria-labelledby="ask-title"><div class="sheet-head">${icon('sail','sail')} Ask Vela ${draft?'<span class="draft-label">Draft · ready to review</span>':''}</div><h1 id="ask-title">What would you like?</h1><p class="intro">Find something to watch, set the mood, or make Vela yours.</p><label class="request-label" for="request">Your request</label><textarea id="request" class="request-field ${!draft&&!listening?'remote':''}" placeholder="Type a request…" ${listening?'readonly':''}>${draft?'Find a quiet film for tonight':''}</textarea><div class="actions"><button class="btn primary ${draft?'remote':''}" id="ask-submit" data-action="submit" ${!draft?'disabled':''}>${icon('sail')} Ask</button><button class="btn ${listening?'remote':''}" data-action="${listening?'stop-listening':'speak'}">${icon('mic')} ${listening?'Stop listening':'Speak'}</button><button class="btn text back" data-view="home-night">${icon('back')} Back</button></div>${listening?'<p class="listening-note"><span class="status-dot"></span>Listening · your words become a draft</p>':unavailable?'<p class="sheet-foot">Speech is unavailable. You can type your request instead.</p>':'<p class="sheet-foot">Type, speak, or ask from your paired phone.</p>'}</section>`}
function details(){return home({focus:false})+`<div class="scrim"></div><section class="sheet glass dense detail-sheet" role="dialog" aria-label="The Quiet North details"><div class="detail-top"><button class="btn text small remote" data-view="home-night">${icon('back')} Back</button><button class="btn text small" id="save-list" data-action="save-list">+ &nbsp; Save to My list</button></div><div class="detail-body"><div class="detail-poster"><img src="${ART.north}" alt="The Quiet North, alpine lake cabin"><span class="art-shade"></span><span class="poster-wordmark">THE<br>QUIET<br>NORTH</span></div><div class="detail-info"><span class="eyebrow">Movie · Jellyfin</span><h1 style="margin-block-start:7px">The Quiet North</h1><p class="metadata">2025 · 1 hr 34 min · Documentary</p><p class="synopsis">One cabin, one changing season. A quiet journey into the lives shaped by a northern lake.</p><div class="resume-block"><p>Resume at 1:10:00 · 24 min remaining</p><button class="btn primary" data-action="resume">▶ &nbsp; Resume The Quiet North</button></div></div></div><p class="detail-note">From your Jellyfin library · This item supports direct resume.</p></section>`}
function editor(){return `<div class="scene"></div>${shell('Settings')}<aside class="editor-title"><div class="person-avatar">H</div><p class="eyebrow" style="margin-block-end:6px">Current person</p><h1>Household</h1><p class="person-note">Your preferences.<br>A shared home.</p><div class="person-nav"><button class="active">Preferences</button><button data-action="memory">What Vela remembers</button><button data-action="add-person">+ Add a person</button></div></aside><section class="editor-panel glass dense"><h2>Make yourself at home</h2><div class="fields"><label class="field name">Display name<input value="Household" id="person-name"></label><label class="field">Preferred audio<select id="audio-language"><option>English</option><option>Spanish</option><option>Custom language tag…</option></select></label><label class="field">Subtitles<select id="sub-language"><option>Automatic</option><option>English</option><option>Off</option><option>Custom language tag…</option></select></label></div><div class="pref-row"><span>Autoplay</span><button class="toggle" data-action="autoplay" aria-pressed="false">Off</button></div><div class="actions"><button class="btn text remote" data-view="home-night">${icon('back')} Back</button><span class="save-note" id="save-note">Unsaved preferences</span><button class="btn primary save" data-action="save-person">Save</button></div><p style="font-size:11px;line-height:18px;color:var(--muted-ink);margin-block-start:10px">Anyone in the room can switch; profiles have no PIN.<br>Home rows and My list are shared.</p></section><button class="maintenance" data-action="recover">Maintenance · Recover household storage…</button>`}
function phone(approval=false){return `<div class="scene"></div><header class="phone-header"><div class="phone-brand">${icon('sail','sail')} Vela</div><div class="connection"><span class="status-dot"></span> Living room</div></header><nav class="phone-tabs"><button class="current" data-view="phone">Conversation</button><button data-action="phone-remote">Remote</button><button data-view="phone-approval">Activity${approval?' · 1':''}</button></nav><div class="phone-body"><div class="phone-greeting">${approval?'One thing to check.':'A little closer to home.'}<p>${approval?'Vela is waiting for your decision.':'Your TV and Vela, within reach.'}</p></div>${approval?`<section class="glass dense phone-approval"><div class="sheet-head" style="color:var(--caution)">${icon('warning')} Needs your OK</div><h2>Open the<br>garage door?</h2><p>Vela wants to open the garage door.</p><p class="approval-target"><strong>Garage door</strong><br>Action · Open</p><button class="btn primary" data-action="phone-allow">Allow once</button><button class="btn text" data-action="phone-decline">Decline</button><p class="approval-small">Prompt GR-042 · This request only.<br><span id="phone-result">Nothing changes until you decide.</span></p></section>`:`<p class="conversation-line">Where did I leave off?</p><div class="phone-reply">${icon('sail','sail')}<p>The Quiet North, with 24 minutes left.<br>Open its details on TV to resume.</p></div><section class="remote-card glass dense" id="phone-remote"><h2>Living room remote</h2><p class="device" id="phone-result">Navigate your TV</p><div class="dpad"><button class="up" data-action="remote" aria-label="Up">⌃</button><button class="left" data-action="remote" aria-label="Left">‹</button><button class="ok" data-action="remote">OK</button><button class="right" data-action="remote" aria-label="Right">›</button><button class="down" data-action="remote" aria-label="Down">⌄</button></div><div class="remote-actions"><button data-action="remote">← Back</button><button data-action="remote">Home</button><button data-action="remote">Apps</button></div></section>`}</div><div class="phone-compose"><input id="phone-input" placeholder="Ask Vela…" aria-label="Your request"><button data-action="phone-send" aria-label="Review request">${icon('send')}</button></div>`}
function notice(kind){let approval=kind==='approval',working=kind==='working'||kind==='opening',opening=kind==='opening';return home({focus:approval||working,agent:approval?'approval':working?'working':'idle'})+`<section class="agent-notice glass dense" ${approval?'role="status"':'role="region"'}><div class="sheet-head ${!working?'unknown':''}">${icon(working?'sail':'warning')} ${approval?'Needs your OK':working?'Working':'Outcome unknown'}</div><h2>${approval?'Open the garage door?':working?(opening?'Opening The Quiet North.':'Finding a quiet film.'):'The app opened.<br>Playback isn’t confirmed.'}</h2><p>${approval?'Vela wants to open the garage door.':working?(opening?'Sending a resume request to Jellyfin. Playback has not been observed.':'You can keep browsing. Review this request in Activity.'):'Check the app before trying again. Vela couldn’t verify what happened next.'}</p>${approval?'<p class="target"><strong>Garage door</strong><br>Action · Open</p><p class="instruction">OK to allow · Back to cancel</p><p class="prompt-id">Prompt GR-042 · Or answer on your paired phone.</p>':working?'<div class="actions"><button class="btn small" data-action="activity">Activity</button><button class="btn text small" data-action="stop-task">Stop task…</button></div>':'<p class="target">The Quiet North · External app handoff</p><div class="actions"><button class="btn small remote" data-action="activity">Review Activity</button><button class="btn text small" data-view="home-night">Back</button></div>'}</section>`}
function shellStates(){return `<div class="scene"></div><div style="position:absolute;inset-inline:48px;inset-block-start:38px"><p class="eyebrow">Shell state specimens</p><h1 style="font-size:28px;margin-block-start:12px">A quiet presence. A stable place.</h1></div>${['idle','working','approval'].map((state,i)=>`<div style="position:absolute;inset:0;transform:translateY(${110+i*115}px)">${shell('Home',state,false).replace('Household</span>','Alexandra Montgomery</span>').replace('class="profile"','class="profile" aria-label="Alexandra Montgomery, preferences" title="Alexandra Montgomery"')}</div><p style="position:absolute;inset-inline-start:48px;inset-block-start:${201+i*115}px;font-size:13px;color:var(--muted-ink)">${['Ready when you ask','Work continues while you browse','A decision is needed · target positions stay fixed'][i]}</p>`).join('')}`}
function materials(){return `<div class="scene"></div><section class="material-board"><p class="eyebrow">Vela · Optical study</p><h1>Light comes from the picture.</h1><div class="material-samples">${['north','train','table'].map((x,i)=>`<div class="material-sample"><img src="${ART[x]}" alt="${x} photography material test"><div class="sample-pane glass dense" style="--soft:url('${SOFT[x]}');background-size:100% 100%,272px 210px;background-position:center"><p><strong>${['Daylight','Dark detail','Warm complexity'][i]}</strong><br>A calm place to read.<br>One lit edge.</p></div></div>`).join('')}</div><div class="tier-row"><p><strong>Cached artwork glass</strong>Soft artwork is prepared once; a coherent crop supplies transmitted color beneath local tint and edge light.</p><p><strong>Opaque, equally considered</strong>Solid reading regions, identical typography and control geometry. Contrast and focus carry the experience.</p><p><strong>Still by design</strong>No live blur, refraction animation, perpetual shimmer or performance claim. Hardware validation remains future work.</p></div></section>`}
function render(view=current,overrideTheme){current=view;if(overrideTheme)theme=overrideTheme;else if(view==='home-day')theme='day';else if(view==='home-night')theme='night';let isPhone=view.startsWith('phone'),apps=view==='apps'||view==='undo'||view==='undo-kept'||view==='busy';let html=view.startsWith('ask')||view==='opaque-ask'?ask():view==='details'?details():view==='editor'?editor():isPhone?phone(view==='phone-approval'):view==='app-focus'?`<div class="scene"></div>${shell()}${context(true)}<div class="rails"><div class="rail-heading"><h2>Apps</h2><span class="count">Settings · OK to open</span></div>${appsRow(true,true)}<section class="recent-rail"><div class="rail-heading"><h2>Recently added</h2><span class="source">Jellyfin</span></div>${mediaRow(false,true)}</section></div>`:apps?sparse(view==='undo'||view==='busy'):view==='arrange'?arrangeSheet():view==='restore'?sparse(false,true)+`<div class="scrim"></div><section class="sheet glass dense restore-sheet" role="dialog"><h1>Restore default layout?</h1><p class="intro">Replace your current rows with Continue watching, Apps, Recently added and My list?</p><div class="actions"><button class="btn remote" data-view="apps">Cancel</button><button class="btn primary" data-action="restore">Restore defaults</button></div></section>`:view==='shell-states'?shellStates():view==='working'||view==='opening'||view==='approval'||view==='unknown'?notice(view):view==='materials'?materials():home({entry:view==='home-entry',focus:view!=='home-entry'});
let className=`tv ${theme==='day'?'day':''} ${opaque||view.startsWith('opaque')?'opaque':''} ${apps||['editor','restore','arrange'].includes(view)?'ambient':''} ${apps||['restore','arrange'].includes(view)?'apps-home':''} ${view==='undo'||view==='busy'?'with-receipt':''} ${view==='app-focus'?'app-focus':''} ${isPhone?'phone':''}`;
document.getElementById('mount').innerHTML=isPhone?`<div class="phone-viewport"><div class="${className}">${html}</div></div>`:`<div class="viewport"><div class="${className}">${html}</div></div>`;
let n=notes[view]||notes['home-night'];document.getElementById('notes').innerHTML=`<p><strong>${n[0]}.</strong> ${n[1]}</p><p><strong>Interaction.</strong> ${n[2]}</p>`;document.getElementById('view-picker').value=view;document.getElementById('theme-toggle').textContent=theme==='day'?'Night':'Day';document.getElementById('material-toggle').textContent=(opaque||view.startsWith('opaque'))?'Glass':'Opaque';resize();requestAnimationFrame(audit)}
function resize(){const v=document.querySelector('.viewport');if(v)v.style.setProperty('--scale',v.clientWidth/960);const p=document.querySelector('.phone-viewport');if(p){p.style.setProperty('--phone-scale',p.clientWidth/393);p.style.blockSize=(790*p.clientWidth/393)+'px'}}
function audit(){const tv=document.querySelector('.tv');if(!tv)return;const imgs=[...tv.querySelectorAll('img')];const focus=tv.querySelectorAll('.remote');window.VELA_AUDIT={view:current,theme,opaque:opaque||current.startsWith('opaque'),images:imgs.length,loaded:imgs.filter(i=>i.complete&&i.naturalWidth>0).length,focusCount:focus.length,focusTarget:focus[0]?.getAttribute('aria-label')||focus[0]?.getAttribute('id')||focus[0]?.textContent?.trim(),frameWidth:tv.offsetWidth,frameHeight:tv.offsetHeight};console.log('VELA_RENDER',JSON.stringify(window.VELA_AUDIT));const boundary=tv.getBoundingClientRect();const clipped=[...tv.querySelectorAll('button,input,select,textarea,.editor-panel > p')].filter(n=>{const r=n.getBoundingClientRect();return r.bottom>boundary.bottom+1||r.right>boundary.right+1});if(clipped.length)console.warn('VELA_OUTSIDE_FRAME',clipped.map(n=>n.textContent||n.getAttribute('aria-label')))}
function feedback(message){const target=document.getElementById('phone-result')||document.getElementById('save-note');if(target)target.textContent=message;else{document.getElementById('notes').innerHTML=`<p><strong>Local prototype feedback.</strong> ${message}</p><p>No service action occurred.</p>`}}
document.addEventListener('click',e=>{const v=e.target.closest('[data-view]');if(v){render(v.dataset.view);return}const b=e.target.closest('[data-action]');if(!b||b.disabled)return;switch(b.dataset.action){case'destination':feedback(b.dataset.destination+' is a labeled destination. Its full screen is outside this concept prototype.');break;case'move-row':render('undo');break;case'library-settings':feedback('Library settings is acknowledged locally. No connection or library setting was changed.');break;case'keep':keptBusy=current==='busy';kept=true;render('undo-kept');break;case'undo':keptBusy=false;kept=false;undone=true;render('apps');break;case'restore':undone=false;render('undo');break;case'speak':render('ask-listening');break;case'stop-listening':render('ask-draft');break;case'submit':render('working');break;case'resume':render('opening');feedback('Opening The Quiet North from Jellyfin is illustrated. Playback has not been observed.');break;case'open-app':feedback(`${b.dataset.app}: Open requested in the local prototype. App launch and playback are not observed.`);break;case'save-list':b.textContent=b.textContent.includes('Remove')?'+   Save to My list':'✓   Remove from My list';feedback('My list changed in this local demonstration only.');break;case'save-person':feedback('Preferences saved in this demonstration only.');break;case'autoplay':let on=b.getAttribute('aria-pressed')==='true';b.setAttribute('aria-pressed',String(!on));b.textContent=on?'Off':'On';break;case'phone-allow':case'phone-decline':document.querySelectorAll('.phone-approval button').forEach(x=>x.disabled=true);feedback(b.dataset.action==='phone-allow'?'Allow once selected locally. No real approval was sent.':'Declined locally. No real decision was sent.');break;case'phone-remote':document.getElementById('phone-remote')?.scrollIntoView({block:'nearest'});break;case'remote':feedback('Remote input illustrated · no TV command sent.');break;case'phone-send':feedback(document.getElementById('phone-input').value?'Draft reviewed locally. Nothing was sent.':'Type a request first.');break;case'stop-task':feedback('Stop task requires a deliberate confirmation in production. No task runs in this prototype.');break;case'recover':feedback('Recover household storage remains a confirm-first maintenance action. No recovery was attempted.');break;case'memory':case'add-person':case'activity':feedback('Destination acknowledged locally; this focused concept does not implement the production workflow.');break}});
document.addEventListener('input',e=>{if(e.target.id==='request'){document.getElementById('ask-submit').disabled=!e.target.value.trim()}});
document.addEventListener('change',e=>{if(e.target.tagName==='SELECT'&&e.target.value==='Custom language tag…'){const input=document.createElement('input');input.placeholder='Language tag, e.g. en-US';input.setAttribute('aria-label','Custom language tag');e.target.replaceWith(input)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){render('home-night');return}if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;const root=document.querySelector('.sheet')||document.querySelector('.editor-panel')||document.querySelector('.tv');if(!root)return;const nodes=[...root.querySelectorAll('button:not(:disabled),input,textarea,select')];const from=nodes.includes(document.activeElement)?document.activeElement:root.querySelector('.remote');if(!from)return;const r=from.getBoundingClientRect(),x=r.x+r.width/2,y=r.y+r.height/2;const horizontal=e.key==='ArrowLeft'||e.key==='ArrowRight',sign=e.key==='ArrowLeft'||e.key==='ArrowUp'?-1:1;const candidates=nodes.filter(n=>n!==from).map(n=>{let q=n.getBoundingClientRect(),dx=q.x+q.width/2-x,dy=q.y+q.height/2-y;return{n,a:horizontal?dx:dy,b:horizontal?dy:dx}}).filter(q=>q.a*sign>5).sort((a,b)=>(Math.abs(a.a)+Math.abs(a.b)*3)-(Math.abs(b.a)+Math.abs(b.b)*3));if(candidates.length){e.preventDefault();candidates[0].n.focus()}});
document.getElementById('view-picker').innerHTML=views.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');document.getElementById('view-picker').onchange=e=>render(e.target.value);document.getElementById('theme-toggle').onclick=()=>render(current,theme==='day'?'night':'day');document.getElementById('material-toggle').onclick=()=>{opaque=!(opaque||current.startsWith('opaque'));if(current==='opaque-home')render(theme==='day'?'home-day':'home-night',theme);else if(current==='opaque-ask')render('ask',theme);else render()};new ResizeObserver(resize).observe(document.getElementById('mount'));document.getElementById('gallery-head').hidden=init.controls===false;document.getElementById('notes').hidden=init.notes===false;document.addEventListener('load',audit,true);window.vela={show:render,views:views.map(x=>x[0]),audit};render(init.view||'home-night',init.theme);document.fonts.ready.then(()=>{resize();audit()});
</script></body></html>
